name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: boluwatifeajayi
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          output_action: none

      - name: Get real PR review count
        id: reviews
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          COUNT=$(gh api graphql -f query='query { search(query: "is:pr reviewed-by:boluwatifeajayi", type: ISSUE) { issueCount } }' -q .data.search.issueCount)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Fix "Pull requests reviewed" stat
        env:
          REVIEW_COUNT: ${{ steps.reviews.outputs.count }}
        run: |
          python3 - <<'EOF'
          import os, re
          count = os.environ["REVIEW_COUNT"]
          with open("/metrics_renders/github-metrics.svg", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(
              r'(<div class="field">\s*<svg[^>]*>.*?</svg>\s*)\d+( Pull requests reviewed\s*</div>)',
              lambda m: f"{m.group(1)}{count}{m.group(2)}",
              content,
              flags=re.DOTALL,
          )
          with open("github-metrics.svg", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub metrics"
            git push
          fi
